# Standalone file: run from the repository root with the companion env example.
# Traefik and the host CIFS mount are managed outside this stack.
services:
  qontract-api:
    image: qontract-api:${QONTRACT_RELEASE:?Set an image/release tag}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${QONTRACT_SECRETS_FILE:?Set the absolute path to api.env}
    environment:
      ASPNETCORE_ENVIRONMENT: ${QONTRACT_ENVIRONMENT:-Staging}
      ASPNETCORE_URLS: http://+:8080
      Database__Provider: ${DATABASE_PROVIDER:?Choose a database provider}
      Storage__Provider: local
      Storage__Path: /app/Storage
      Cors__Origins__0: ${WEB_ORIGIN:?Set the public web origin}
      Cors__Origins__1: ${WEB_ORIGIN:?Set the public web origin}
      AllowedHosts: "${API_HOST:?Set the public API hostname};127.0.0.1"
      Registration__AllowPublic: ${ALLOW_PUBLIC_REGISTRATION:-false}
      PasswordReset__Enabled: ${PASSWORD_RESET_ENABLED:-false}
      PasswordReset__PublicAppUrl: ${PUBLIC_APP_URL:-}
      ReverseProxy__KnownProxies__0: ${TRUSTED_PROXY_IP:?Set Traefik's IP on the proxy network}
    # A missing/unmounted share must not become an empty local document folder.
    # Provision this marker on the mounted share before the first startup.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ ! -f /app/Storage/.qontract-storage-ready ]; then
          echo 'Document storage marker missing; check the host CIFS mount.' >&2
          exit 1
        fi
        exec dotnet Qontract.API.dll
    volumes:
      - database:/app/data
      - type: bind
        source: ${DOCUMENTS_HOST_PATH:?Set the absolute CIFS-backed document directory}
        target: /app/Storage
        bind:
          create_host_path: false
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:?Set the existing Traefik network}"
      - "traefik.http.routers.${TRAEFIK_ROUTER:?Set a unique router name}.rule=Host(`${API_HOST}`)"
      - "traefik.http.routers.${TRAEFIK_ROUTER}.entrypoints=${TRAEFIK_HTTPS_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.${TRAEFIK_ROUTER}.tls=true"
      - "traefik.http.routers.${TRAEFIK_ROUTER}.tls.certresolver=${TRAEFIK_CERT_RESOLVER:?Set the existing certificate resolver}"
      - "traefik.http.routers.${TRAEFIK_ROUTER}.service=${TRAEFIK_ROUTER}"
      - "traefik.http.services.${TRAEFIK_ROUTER}.loadbalancer.server.port=8080"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Local Docker volume, never on CIFS. Used by the SQLite example only.
  database:

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:?Set the existing Traefik network}
