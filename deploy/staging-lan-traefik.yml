http:
  routers:
    api:
      rule: PathPrefix(`/api`) || Path(`/health/ready`)
      entryPoints: [websecure]
      priority: 100
      service: api
      tls: {}
    web:
      rule: PathPrefix(`/`)
      entryPoints: [websecure]
      priority: 1
      service: web
      tls: {}
  services:
    api:
      loadBalancer:
        servers:
          - url: http://api:8080
    web:
      loadBalancer:
        servers:
          - url: http://web:8080
