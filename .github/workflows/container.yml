name: Backend container

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Backend tests
        run: dotnet test Qontract.sln --configuration Release
      - name: Set up Docker builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build verification image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: qontract-api:verify
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Check container startup and database migrations
        shell: bash
        run: |
          set -euo pipefail
          jwt_key="$(openssl rand -hex 32)"
          echo "::add-mask::$jwt_key"
          docker run -d --name qontract-api-verify \
            -e ASPNETCORE_ENVIRONMENT=Staging \
            -e Database__Provider=sqlite \
            -e ConnectionStrings__DefaultConnection='Data Source=/app/data/verify.sqlite' \
            -e "Jwt__Key=$jwt_key" \
            -e Storage__Path=/app/Storage \
            -e AllowedHosts=127.0.0.1 \
            qontract-api:verify
          for attempt in {1..60}; do
            if docker exec qontract-api-verify curl --fail --silent http://127.0.0.1:8080/health/ready > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs qontract-api-verify
          exit 1
      - name: Remove verification container
        if: always()
        run: docker rm -f qontract-api-verify || true

  publish:
    needs: verify
    # PR builds never authenticate or publish. Manual publishing is restricted
    # to master; version tags and master pushes are the other release triggers.
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/master' ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Image coordinates
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<EOF'
            echo "$image:sha-$GITHUB_SHA"
            if [ "$GITHUB_REF" = 'refs/heads/master' ]; then
              echo "$image:master"
            elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "$image:${GITHUB_REF#refs/tags/}"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Set up Docker builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Sign in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Published image reference
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo '### Backend image'
            echo "Pinned deployment reference: \`$IMAGE_NAME@$IMAGE_DIGEST\`"
            echo 'Copy this reference into QONTRACT_IMAGE in the deployment env file.'
          } >> "$GITHUB_STEP_SUMMARY"
